name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: gove
          POSTGRES_PASSWORD: gove_ci_only
          POSTGRES_USER: gove
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gove -d gove"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gove:gove_ci_only@127.0.0.1:5432/gove

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker compose config --quiet
      - run: npm run db:migrate
      - run: npm run check
