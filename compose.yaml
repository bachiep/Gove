name: gove

services:
  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:26.9.0-debian}
    profiles: ['osrm']
    command:
      [
        'osrm-routed',
        '--algorithm',
        '${OSRM_ALGORITHM:-mld}',
        '/data/${OSRM_DATASET:-hanoi-latest}.osrm',
      ]
    environment:
      OSRM_DATASET: ${OSRM_DATASET:-hanoi-latest}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -r "/data/$${OSRM_DATASET}.osrm.properties" && kill -0 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    ports:
      - '127.0.0.1:${OSRM_PORT:-5500}:5000'
    restart: unless-stopped
    volumes:
      - type: volume
        source: gove-osrm-data
        target: /data
        read_only: true

  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gove_local_only}
      POSTGRES_USER: ${POSTGRES_USER:-gove}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    restart: unless-stopped
    volumes:
      - gove-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  gove-osrm-data:
    external: true
    name: ${OSRM_VOLUME_NAME:-gove-osrm-data}
  gove-postgres:
