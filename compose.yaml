name: gove

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gove_local_only}
      POSTGRES_USER: ${POSTGRES_USER:-gove}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    restart: unless-stopped
    volumes:
      - gove-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  gove-postgres:
